<!DOCTYPE html>
<!-- Şablon C — Tam ekran fotoğraf + lacivert gradyan overlay.
     Dramatik, sektörü sarsan, büyük etki yaratan haberler için. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
{% include "_base.css" %}

.canvas {
  width: 1080px;
  height: 1350px;
  position: relative;
}

.bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(13, 27, 79, 0.15) 0%,
    rgba(13, 27, 79, 0.55) 55%,
    rgba(13, 27, 79, 0.92) 100%
  );
}

.content {
  position: absolute;
  inset: 0;
  padding: 70px;
  display: flex;
  flex-direction: column;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  color: var(--lime);
  font-weight: 600;
  font-size: 30px;
  letter-spacing: 6px;
}

.slide {
  background: var(--lime);
  color: var(--navy);
  font-weight: 700;
  font-size: 26px;
  padding: 8px 20px;
  border-radius: 22px;
}

.bottom {
  margin-top: auto;
  display: flex;
  gap: 32px;
  max-height: 640px; /* başlık kutusu alt yarıda kalsın, fotoğraf nefes alsın */
}

.bar {
  width: 8px;
  flex-shrink: 0;
  background: var(--lime);
  border-radius: 4px;
}

#titlebox {
  overflow: hidden;
  display: flex;
  align-items: flex-end;
}

#title {
  color: var(--white);
  width: 100%;
}

.source {
  color: rgba(255, 255, 255, 0.75);
  font-size: 30px;
  font-weight: 400;
  margin-top: 28px;
  padding-left: 40px; /* çubuk + boşlukla hizalı */
}
</style>
</head>
<body>
<div class="canvas">
  <img class="bg" src="{{ image_data }}" alt="">
  <div class="overlay"></div>
  <div class="content">
    <div class="top">
      <div class="brand">GENERAL AI NEWS</div>
      {% if badge %}<div class="slide">{{ badge }}</div>{% endif %}
    </div>
    <div class="bottom">
      <div class="bar"></div>
      <div id="titlebox"><h1 id="title">{{ title }}</h1></div>
    </div>
    <div class="source">— {{ source }}</div>
  </div>
</div>
<script>
{% include "_fit_title.js" %}
</script>
</body>
</html>
