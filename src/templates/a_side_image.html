<!DOCTYPE html>
<!-- Şablon A — Beyaz asimetrik: sol %62 metin, sağ %38 fotoğraf.
     Kavramsal konular, analizler, yazılım/model haberleri için. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
{% include "_base.css" %}

.canvas {
  width: 1080px;
  height: 1350px;
  display: flex;
}

.left {
  flex: 1;
  background: var(--white);
  padding: 90px 70px 80px;
  display: flex;
  flex-direction: column;
}

.badge {
  align-self: flex-start;
  background: var(--lime);
  color: var(--navy);
  font-weight: 600;
  font-size: 24px;
  padding: 10px 22px;
  border-radius: 23px;
  margin-bottom: 40px;
}

#titlebox {
  flex: 1;
  display: flex;
  align-items: center;
  overflow: hidden;
}

#title {
  color: var(--navy);
  width: 100%;
}

.footer {
  margin-top: 40px;
}

.footer .logo {
  width: 64px;
  height: 64px;
  display: block;
  margin-bottom: 16px;
}

.footer .source {
  color: var(--gray-text);
  font-size: 30px;
  font-weight: 400;
}

.divider {
  width: 4px;
  background: var(--lime);
}

.right {
  width: 410px; /* 1080 * 0.38 */
}

.right img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* oranı bozmadan doldur, taşanı kırp */
}
</style>
</head>
<body>
<div class="canvas">
  <div class="left">
    {% if badge %}<div class="badge">{{ badge }}</div>{% endif %}
    <div id="titlebox"><h1 id="title">{{ title }}</h1></div>
    <div class="footer">
      {% if logo_data %}<img class="logo" src="{{ logo_data }}" alt="">{% endif %}
      <div class="source">— {{ source }}</div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="right"><img src="{{ image_data }}" alt=""></div>
</div>
<script>
{% include "_fit_title.js" %}
</script>
</body>
</html>
